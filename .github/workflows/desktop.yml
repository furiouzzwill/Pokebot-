name: Build desktop app

# Produces installers so a non-technical user can download and double-click
# instead of installing Node and running npm.
#
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to attach the
# installers to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish the installers under (blank = build only, no Release)'
        required: false
        default: 'v0.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The dashboard and monitor need only runtime deps; Electron is 300MB+
      # and irrelevant to the test suite.
      - run: npm install --omit=dev
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Pokebot-mac
          - os: windows-latest
            artifact: Pokebot-windows
          - os: ubuntu-latest
            artifact: Pokebot-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # Unsigned builds: users will see an "unidentified developer" warning.
      # Signing needs paid Apple/Windows certificates -- see README.
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: warn

  # Publishes a Releases entry so a non-technical user can download an
  # installer directly, without a GitHub login or unzipping a CI artifact.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push the ref supplies the name; a manual run names it here.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Download the installer for your platform and run it. Node is
            bundled — there is nothing else to install.

            - **Windows** — `.exe`
            - **macOS** — `.dmg`
            - **Linux** — `.AppImage`

            Builds are unsigned, so the first launch shows a publisher warning.
            macOS: right-click the app → **Open** → **Open**.
            Windows: **More info** → **Run anyway**.

            The app runs in the tray/menu bar. Closing the window keeps it
            watching; quit from the tray icon.

            Carting and checkout still happen in your own Chrome via the
            extension in `extension/` — see the README.
